[project]
name = "wcarck"
version = "0.1.0"
description = "Wcarck - Portable WiFi Audit Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "structlog>=24.1.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.18.4",
    "aiohttp>=3.14.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.31",
]

[tool.setuptools.packages.find]
include = ["wcarck*"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "httpx>=0.27.0",
]
